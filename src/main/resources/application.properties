spring.application.name=hibernate-dao
server.port=8080

# PostgreSQL из docker-compose.yml (можно переопределить переменными окружения)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/netology}
spring.datasource.username=${DB_USERNAME:netology}
spring.datasource.password=${DB_PASSWORD:netology}

# Схему и тестовые данные создают миграции Flyway (db/migration),
# Hibernate только проверяет, что Entity совпадают с таблицами
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.flyway.locations=classpath:db/migration
